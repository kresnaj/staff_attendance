        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-surface-muted min-h-screen flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop">
<div class="w-full max-w-4xl bg-surface-container-lowest rounded-xl shadow-md border border-subtle overflow-hidden flex flex-col md:flex-row">
<!-- Left Side: Branding / Info (Hidden on very small screens, shown as block otherwise) -->
<div class="hidden md:flex flex-col justify-between w-1/2 p-10 bg-secondary-container text-on-secondary-container relative">
<!-- Decorative background element -->
<div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_bottom_left,_var(--tw-gradient-stops))] from-white via-transparent to-transparent"></div>
<div class="relative z-10">
<h1 class="font-h1 text-h1 text-on-secondary mb-2 flex items-center gap-3">
<span class="material-symbols-outlined text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">domain</span>
                    SIPEGAS
                </h1>
<p class="font-body-lg text-body-lg text-on-secondary/80">Sistem Informasi Presensi Pegawai Sekolah</p>
</div>
<div class="relative z-10 mt-12">
<img alt="School Building" class="rounded-lg shadow-lg border-2 border-white/20 object-cover h-64 w-full grayscale opacity-80 mix-blend-multiply" data-alt="A modern school building facade viewed from an angle. The architecture is clean and institutional, featuring large windows and brick or concrete walls. The image has a slightly muted, professional tone, fitting a corporate or administrative educational system login screen. The lighting is bright and even, suggesting a clear day. The overall aesthetic is functional and trustworthy, aligning with the SIPEGAS brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEUdMRizu5LXKhCqVryuYGVKoSBfNzUOpoCFdUeIIE7xpKqDXGUzVBa5FBBvF1-Eb8wrOXrK5CoC1YcLIMhOosuKk6Mkfe0WL3tLoRKItmHUfg11H3RFp-1SWe5C7u26n-o2zoHTK2VemiDiRNcKiwVaTENepASqrQ_sV9vw4RgqpuXnzPnupwgA05QMKlMcG8Dpbv1iFtl0QM6_nzF61gnmgWc9u9Wx-ko7BVQ2_YKfeLLt8QO0DKBaOUgGDbPSH05uC722PQyrk"/>
</div>
<div class="relative z-10 mt-8 text-sm text-on-secondary/60">
                © 2024 SIPEGAS Admin System. All rights reserved.
            </div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
<!-- Mobile Branding (Only visible on small screens) -->
<div class="md:hidden flex items-center justify-center mb-8">
<h1 class="font-h1 text-h1 text-secondary flex items-center gap-2">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">domain</span>
                    SIPEGAS
                </h1>
</div>
<div class="mb-8">
<h2 class="font-h2 text-h2 text-on-surface mb-2">Welcome Back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please select your role to continue.</p>
</div>
<!-- Role Selection Grid -->
<div class="grid grid-cols-2 gap-4 mb-8">
<!-- Role: Admin / HR -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-subtle bg-surface hover:bg-surface-container-low hover:border-outline transition-all group focus:outline-none focus:ring-2 focus:ring-secondary focus:border-transparent">
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">manage_accounts</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface">Admin / HR</span>
</button>
<!-- Role: Yayasan -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-subtle bg-surface hover:bg-surface-container-low hover:border-outline transition-all group focus:outline-none focus:ring-2 focus:ring-secondary focus:border-transparent">
<div class="w-12 h-12 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">account_balance</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface">Yayasan</span>
</button>
<!-- Role: Principal -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-subtle bg-surface hover:bg-surface-container-low hover:border-outline transition-all group focus:outline-none focus:ring-2 focus:ring-secondary focus:border-transparent">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">school</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface">Principal</span>
</button>
<!-- Role: Teacher / Staff -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-primary bg-surface-container-low ring-1 ring-primary transition-all group focus:outline-none relative">
<div class="absolute top-2 right-2 w-2 h-2 rounded-full bg-secondary"></div>
<div class="w-12 h-12 rounded-full bg-surface-variant text-on-surface flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">badge</span>
</div>
<span class="font-label-caps text-label-caps text-primary">Teacher / Staff</span>
</button>
</div>
<!-- Login Form (Dynamic based on selection, here defaulting to generic input) -->
<form class="space-y-4">
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-1" for="employee-id">Employee ID / Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-opacity-70 text-sm">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg leading-5 bg-surface-container-lowest placeholder-outline focus:outline-none focus:ring-1 focus:ring-secondary focus:border-secondary sm:text-sm font-body-sm text-body-sm text-on-surface" id="employee-id" name="employee-id" placeholder="e.g. EP2346172" type="text"/>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-1" for="password">Password / PIN</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-opacity-70 text-sm">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg leading-5 bg-surface-container-lowest placeholder-outline focus:outline-none focus:ring-1 focus:ring-secondary focus:border-secondary sm:text-sm font-body-sm text-body-sm text-on-surface" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex justify-end mt-1">
<a class="font-label-caps text-label-caps text-secondary hover:text-secondary-container transition-colors" href="#">Forgot password?</a>
</div>
</div>
<div class="pt-4">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-caps text-label-caps text-on-primary bg-primary hover:bg-on-background focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors min-h-[48px]" type="button">
                        Login to SIPEGAS
                        <span class="material-symbols-outlined ml-2 text-sm">arrow_forward</span>
</button>
</div>
</form>
<!-- Quick Action for Pegawai (Mobile Utility Focus) -->
<div class="mt-8 pt-6 border-t border-subtle text-center md:hidden">
<p class="font-body-sm text-body-sm text-on-surface-variant mb-4">Quick action for today</p>
<button class="w-full flex justify-center items-center py-3 px-4 border border-outline rounded-lg bg-surface text-on-surface hover:bg-surface-container-low transition-colors min-h-[48px]" type="button">
<span class="material-symbols-outlined mr-2 text-secondary">qr_code_scanner</span>
<span class="font-label-caps text-label-caps">Scan QR Presensi</span>
</button>
</div>
</div>
</div>
</body></html>
