<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Critical Presence Flow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "tertiary": "#000000",
                        "secondary-fixed": "#d8e2ff",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f3f0f2",
                        "secondary": "#0058be",
                        "on-background": "#1b1b1d",
                        "surface-container": "#f0edef",
                        "on-error-container": "#93000a",
                        "border-subtle": "#E2E8F0",
                        "presence-info": "#6366F1",
                        "on-tertiary-fixed": "#271901",
                        "on-tertiary-fixed-variant": "#574425",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#1b1b1d",
                        "outline": "#76777d",
                        "surface": "#fcf8fa",
                        "primary-container": "#131b2e",
                        "on-secondary-fixed": "#001a42",
                        "error-container": "#ffdad6",
                        "background": "#fcf8fa",
                        "primary-fixed-dim": "#bec6e0",
                        "surface-container-highest": "#e4e2e4",
                        "on-secondary-container": "#fefcff",
                        "secondary-container": "#2170e4",
                        "on-primary-fixed-variant": "#3f465c",
                        "tertiary-fixed": "#fcdeb5",
                        "surface-dim": "#dcd9db",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#98805d",
                        "surface-tint": "#565e74",
                        "presence-warning": "#F59E0B",
                        "inverse-surface": "#303032",
                        "primary": "#000000",
                        "inverse-primary": "#bec6e0",
                        "surface-muted": "#F8FAFC",
                        "surface-container-high": "#eae7e9",
                        "on-primary-fixed": "#131b2e",
                        "presence-success": "#10B981",
                        "tertiary-container": "#271901",
                        "outline-variant": "#c6c6cd",
                        "surface-container-low": "#f6f3f5",
                        "presence-danger": "#EF4444",
                        "primary-fixed": "#dae2fd",
                        "on-surface-variant": "#45464d",
                        "surface-variant": "#e4e2e4",
                        "on-primary-container": "#7c839b",
                        "secondary-fixed-dim": "#adc6ff",
                        "tertiary-fixed-dim": "#dec29a",
                        "surface-bright": "#fcf8fa",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#004395"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-mobile": "16px",
                        "touch-target-min": "48px",
                        "base": "4px",
                        "gutter": "16px",
                        "container-padding-desktop": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "h1": ["Manrope"],
                        "data-mono": ["JetBrains Mono"],
                        "h2": ["Manrope"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "h1": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "data-mono": ["14px", { "lineHeight": "1", "fontWeight": "500" }],
                        "h2": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased flex flex-col md:flex-row h-screen overflow-hidden">
<!-- Mobile View: Step 1 & 2 Container (Carousel/Swiper conceptual structure for display purposes) -->
<div class="flex-1 w-full flex overflow-x-auto snap-x snap-mandatory hide-scrollbar">
<!-- Step 1: Fullscreen QR Camera -->
<section class="min-w-full h-full snap-start relative bg-tertiary flex flex-col overflow-hidden">
<!-- Simulated Camera Feed Background -->
<div class="absolute inset-0 z-0">
<img alt="Office corridor" class="w-full h-full object-cover opacity-60" data-alt="A slightly blurred, high-contrast POV shot of a modern office lobby floor, representing a live camera feed looking for a QR code. Bright, daylight lighting. Professional corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwHN8z8NSNG1_XjlVpLdiVUwtDk-9weqP_XCkBeVcdf-lVrl51yIP07PhB3dnZZhmA9cnaTZAzeI7YdRinb9j8-2Il07BRaielcHeARpC4nVAMFk4L5FJcztkUXlW8ewQAH1_MKHfiD9T7Km4taXyoYmG29TcYo_7EO14cDRRTMJ4W3krt6eLk36oCV59QrAZt9LhsKUQd77V0WxQDHLEV34rkx0B4SRgahkF-YI2rYKB9Qn3reDAZGdvLrHJzyfm6NNC7kFZn4kY"/>
</div>
<!-- Top Header Overlay -->
<div class="z-10 w-full p-container-padding-mobile flex justify-between items-center bg-gradient-to-b from-black/50 to-transparent">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-tertiary rounded-full bg-black/30 backdrop-blur-sm border border-white/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">close</span>
</button>
<div class="flex items-center gap-2 bg-black/40 backdrop-blur-sm px-4 py-2 rounded-full border border-white/20">
<span class="material-symbols-outlined text-presence-success text-sm" style="font-variation-settings: 'FILL' 1;">my_location</span>
<span class="font-data-mono text-data-mono text-on-tertiary">Akurasi: 4m</span>
</div>
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-tertiary rounded-full bg-black/30 backdrop-blur-sm border border-white/20">
<span class="material-symbols-outlined">flash_on</span>
</button>
</div>
<!-- Central Scanning Box -->
<div class="flex-1 flex flex-col items-center justify-center z-10 p-container-padding-mobile">
<div class="relative w-64 h-64">
<!-- Corner Reticles -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-presence-success"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-presence-success"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-presence-success"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-presence-success"></div>
<!-- Scanning Animation Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-presence-success shadow-[0_0_10px_rgba(16,185,129,0.8)] opacity-70 animate-pulse" style="top: 50%;"></div>
</div>
<p class="mt-8 font-h2 text-h2 text-on-tertiary text-center drop-shadow-md">Scan QR Kehadiran</p>
<p class="mt-2 font-body-sm text-body-sm text-on-tertiary/80 text-center max-w-xs drop-shadow-md">Arahkan kamera ke QR Code yang ditampilkan pada layar Admin.</p>
</div>
<!-- Bottom Actions -->
<div class="z-10 w-full p-container-padding-mobile pb-8 bg-gradient-to-t from-black/80 to-transparent flex flex-col items-center">
<div class="w-16 h-1 bg-white/30 rounded-full mb-6"></div>
<div class="flex items-center justify-center gap-6">
<button class="flex flex-col items-center gap-2 text-on-tertiary opacity-50 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined bg-white/10 p-3 rounded-full">keyboard</span>
<span class="font-label-caps text-label-caps">Input Manual</span>
</button>
</div>
</div>
</section>
<!-- Step 2: Fullscreen Selfie Camera -->
<section class="min-w-full h-full snap-start relative bg-tertiary flex flex-col overflow-hidden">
<!-- Simulated Front Camera Feed Background -->
<div class="absolute inset-0 z-0">
<img alt="Professional selfie" class="w-full h-full object-cover" data-alt="A clear, well-lit portrait photo of a professional woman in a modern office setting. She is looking directly at the camera, representing a front-facing selfie camera view. High contrast, sharp focus, corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDC1ljeUy1Q6WRjhrBDibtCHis1fArThues0KQ17ienPiUQT_om4V8yzp5d2fmCfdZKsJDFu9kEuqawEwh6bARJx8K2IRjjOocLqeqqbW6d1BOUy-rG0N5jRfkRuGpJr-TG9-5SatPXGpmUGWSjrcaUgyanrS9DicTL2zksrEy0tvTmlJBD_2t19MvJIRwWndGkh03yJJsGlbRXKoubKkTd8fmWJE-F900XDJm2s5NiV2eykRLxdtawEQAUCoMw3mI0uBhQ4_5olE"/>
</div>
<!-- Top Header Overlay -->
<div class="z-10 w-full p-container-padding-mobile flex justify-between items-center bg-gradient-to-b from-black/50 to-transparent">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-tertiary rounded-full bg-black/30 backdrop-blur-sm border border-white/20">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex items-center gap-2 bg-presence-success/20 backdrop-blur-md px-4 py-2 rounded-full border border-presence-success/50">
<span class="material-symbols-outlined text-presence-success text-sm" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-caps text-label-caps text-on-tertiary">QR Valid</span>
</div>
<div class="w-touch-target-min"></div> <!-- Spacer for balance -->
</div>
<!-- Central Face Guide -->
<div class="flex-1 flex flex-col items-center justify-center z-10 p-container-padding-mobile">
<div class="relative w-72 h-72 rounded-full border-4 border-white/50 border-dashed overflow-hidden flex items-center justify-center shadow-[0_0_0_9999px_rgba(0,0,0,0.4)]">
<!-- Face Guide Outline -->
<div class="w-32 h-40 border-2 border-white/40 rounded-[4rem] opacity-50"></div>
</div>
<p class="mt-8 font-h2 text-h2 text-on-tertiary text-center drop-shadow-md">Ambil Foto Wajah</p>
<p class="mt-2 font-body-sm text-body-sm text-on-tertiary/80 text-center max-w-xs drop-shadow-md">Pastikan wajah terlihat jelas dan berada di dalam lingkaran panduan.</p>
</div>
<!-- Watermark Info (GPS & Time) -->
<div class="z-10 w-full px-container-padding-mobile py-4 flex justify-between items-end">
<div class="bg-black/50 backdrop-blur-md p-3 rounded-lg border border-white/10">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-on-tertiary text-sm">schedule</span>
<span class="font-data-mono text-data-mono text-on-tertiary">08:12:45 AM</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-tertiary text-sm">location_on</span>
<span class="font-body-sm text-body-sm text-on-tertiary truncate w-48">Gedung Utama, Lt. 2, Area Lobby</span>
</div>
</div>
</div>
<!-- Bottom Actions (Shutter) -->
<div class="z-10 w-full p-container-padding-mobile pb-12 bg-gradient-to-t from-black/90 via-black/50 to-transparent flex flex-col items-center justify-end">
<div class="relative flex items-center justify-center">
<!-- Outer Ring -->
<div class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center">
<!-- Inner Shutter Button -->
<button class="w-16 h-16 bg-white rounded-full active:scale-90 transition-transform"></button>
</div>
</div>
</div>
</section>
</div>
<!-- Global Styles for Scrollbar Hiding -->
<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body></html>
